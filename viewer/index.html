<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HeightNet Terrain Viewer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #101418; color: #eef2f5; }
    #toolbar { position: fixed; z-index: 2; inset: 0 0 auto 0; display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: #182027ee; border-bottom: 1px solid #35424d; }
    #toolbar strong { margin-right: 10px; color: #71d7a3; }
    button, label { border: 1px solid #4b5b67; border-radius: 6px; background: #26323b; color: inherit; padding: 7px 10px; cursor: pointer; }
    button:hover, label:hover { background: #34434e; }
    input[type=file] { display: none; }
    #status { margin-left: auto; color: #aebbc4; font-size: 13px; }
    #info { position: fixed; z-index: 2; top: 62px; right: 14px; width: 260px; padding: 12px; background: #182027dd; border: 1px solid #35424d; border-radius: 8px; font-size: 13px; line-height: 1.45; }
    #info h3 { margin: 0 0 6px; font-size: 15px; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    .hint { color: #91a3af; font-size: 12px; margin-top: 8px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="toolbar">
    <strong>HeightNet Terrain</strong>
    <label>Choose OBJ/MTL/PNG<input id="files" type="file" multiple accept=".obj,.mtl,.png,.jpg,.jpeg,.json" /></label>
    <button id="top">Top view</button>
    <button id="reset">Reset view</button>
    <button id="wire">Wireframe</button>
    <span id="status">Waiting for terrain</span>
  </div>
  <aside id="info">
    <h3>Terrain information</h3>
    <div id="details">Load a mesh to begin.</div>
    <div class="hint">Left drag: orbit · wheel: zoom · right drag: pan</div>
  </aside>
  <canvas id="canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

    const canvas = document.querySelector('#canvas');
    const status = document.querySelector('#status');
    const details = document.querySelector('#details');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101418);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100000);
    camera.up.set(0, 0, 1);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.screenSpacePanning = true;
    const ambient = new THREE.HemisphereLight(0xffffff, 0x334455, 2.2);
    scene.add(ambient);
    const directional = new THREE.DirectionalLight(0xffffff, 2.0);
    directional.position.set(1, -1, 2);
    scene.add(directional);
    const grid = new THREE.GridHelper(100, 20, 0x40515c, 0x26343d);
    grid.rotation.x = Math.PI / 2;
    grid.visible = false;
    scene.add(grid);
    let terrain = null;
    let bounds = null;
    let wireframe = false;

    function setStatus(text) { status.textContent = text; }

    function fitView(object) {
      bounds = new THREE.Box3().setFromObject(object);
      const center = bounds.getCenter(new THREE.Vector3());
      const size = bounds.getSize(new THREE.Vector3());
      const radius = Math.max(size.x, size.y, size.z) * 0.65;
      controls.target.copy(center);
      camera.position.set(center.x + radius, center.y - radius, center.z + radius * 0.75);
      camera.near = Math.max(radius / 1000, 0.1);
      camera.far = Math.max(radius * 100, 1000);
      camera.updateProjectionMatrix();
      controls.update();
    }

    function showDetails(metadata, object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      details.innerHTML = metadata
        ? `CRS: ${metadata.crs ?? 'none'}<br>Vertices: ${metadata.vertex_count ?? '—'}<br>Faces: ${metadata.face_count ?? '—'}<br>Stride: ${metadata.stride ?? '—'}<br>Vertical exaggeration: ${metadata.vertical_exaggeration ?? '—'}<br>Mesh Z size: ${size.z.toFixed(2)}`
        : `Vertices: ${object.children.length ? 'loaded' : '—'}<br>Mesh size: ${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)}`;
    }

    function clearTerrain() {
      if (!terrain) return;
      scene.remove(terrain);
      terrain.traverse(node => {
        if (node.geometry) node.geometry.dispose();
        if (node.material) {
          const materials = Array.isArray(node.material) ? node.material : [node.material];
          materials.forEach(material => { if (material.map) material.map.dispose(); material.dispose(); });
        }
      });
      terrain = null;
    }

    async function loadTerrain(objUrl, mtlUrl, metadataUrl, textureUrl = null) {
      clearTerrain();
      setStatus('Loading terrain…');
      const manager = new THREE.LoadingManager();
      if (textureUrl) manager.setURLModifier(url => url.match(/\.(png|jpe?g)$/i) ? textureUrl : url);
      const loadMetadata = metadataUrl
        ? fetch(metadataUrl).then(response => response.ok ? response.json() : null).catch(() => null)
        : Promise.resolve(null);
      const materials = mtlUrl ? await new MTLLoader(manager).loadAsync(mtlUrl) : null;
      if (materials) materials.preload();
      const loader = new OBJLoader(manager);
      if (materials) loader.setMaterials(materials);
      terrain = await loader.loadAsync(objUrl);
      terrain.traverse(node => {
        if (!node.isMesh) return;
        node.castShadow = true;
        node.receiveShadow = true;
        if (!node.material.map) node.material.color.set(0x8397a2);
      });
      scene.add(terrain);
      fitView(terrain);
      const metadata = await loadMetadata;
      showDetails(metadata, terrain);
      setStatus('Terrain loaded');
    }

    async function loadFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const obj = params.get('obj');
      if (!obj) return false;
      const mtl = params.get('mtl') || null;
      const texture = params.get('texture') || null;
      const metadata = params.get('metadata') || null;
      await loadTerrain(obj, mtl, metadata, texture);
      return true;
    }

    async function loadFiles(fileList) {
      const files = [...fileList];
      const find = extension => files.find(file => file.name.toLowerCase().endsWith(extension));
      const obj = find('.obj');
      const mtl = find('.mtl');
      const texture = find('.png') || find('.jpg') || find('.jpeg');
      const metadata = find('.json');
      if (!obj) throw new Error('Choose an OBJ file.');
      const urls = [obj, mtl, texture, metadata].map(file => file ? URL.createObjectURL(file) : null);
      try {
        await loadTerrain(urls[0], urls[1], urls[3], urls[2]);
      } finally {
        urls.filter(Boolean).forEach(url => URL.revokeObjectURL(url));
      }
    }

    document.querySelector('#files').addEventListener('change', event => loadFiles(event.target.files).catch(error => setStatus(error.message)));
    document.querySelector('#reset').addEventListener('click', () => { if (terrain) fitView(terrain); });
    document.querySelector('#top').addEventListener('click', () => {
      if (!bounds) return;
      const center = bounds.getCenter(new THREE.Vector3());
      const size = bounds.getSize(new THREE.Vector3());
      camera.position.set(center.x, center.y, center.z + Math.max(size.x, size.y) * 0.9);
      controls.target.copy(center);
      controls.update();
    });
    document.querySelector('#wire').addEventListener('click', () => {
      wireframe = !wireframe;
      if (terrain) terrain.traverse(node => { if (node.isMesh) node.material.wireframe = wireframe; });
    });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    animate();
    loadFromQuery().catch(error => setStatus(`Could not load generated terrain: ${error.message}`));
  </script>
</body>
</html>
